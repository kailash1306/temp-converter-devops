name: DevOps Pipeline

on:
  push:
    branches: [ main ]

jobs:
  devops-stages:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Source Code Checkout
      uses: actions/checkout@v4

    - name: 2. CI - Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 2. CI - Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 2. CI - Run Automated Tests
      run: |
        pytest test_app.py

    - name: 3. Build - Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 3. Build & Push Unique Tagged Image
      run: |
        TAG=$(echo ${GITHUB_SHA} | cut -c1-7)
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/temp-converter:$TAG .
        docker push ${{ secrets.0DOCKERHUB_USERNAME }}/temp-converter:$TAG

    - name: 4. Deployment Prep - Update Manifest
      run: |
        TAG=$(echo ${GITHUB_SHA} | cut -c1-7)
        sed -i "s/DOCKERHUB_USERNAME/${{ secrets.DOCKERHUB_USERNAME }}/g" k8s/deployment.yml
        sed -i "s/IMAGE_TAG/$TAG/g" k8s/deployment.yml

    - name: 5. Archive Prepared Kubernetes File
      uses: actions/upload-artifact@v4
      with:
        name: k8s-manifest
        path: k8s/deployment.yml
