name: 5-Stage DevOps Pipeline

on:
  push:
    branches: [ main ]

jobs:
  devops-workflow:
    runs-on: ubuntu-latest
    steps:
      # Stage 1 & 2: Source Code & Version Control
      - name: Checkout Code
        uses: actions/checkout@v4

      # Stage 3: Continuous Integration (Dependencies & Testing)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Automated Tests
        run: |
          pytest test_app.py

      # Stage 4: Build Stage (Docker Registry Upload with Short Git SHA)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          TAG=$(echo ${GITHUB_SHA} | cut -c1-7)
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/temp-converter:$TAG .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/temp-converter:$TAG

      # Stage 5: Deployment Prep
      - name: Inject Unique Metadata into Manifest
        run: |
          TAG=$(echo ${GITHUB_SHA} | cut -c1-7)
          sed -i "s/DOCKERHUB_USERNAME/${{ secrets.DOCKERHUB_USERNAME }}/g" k8s/deployment.yml
          sed -i "s/IMAGE_TAG/$TAG/g" k8s/deployment.yml

      - name: Archive Updated Kubernetes Manifest
        uses: actions/upload-artifact@v4
        with:
          name: k8s-manifest
          path: k8s/deployment.yml
