apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-k8s-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-k8s-demo
  template:
    metadata:
      labels:
        app: student-k8s-demo
    spec:
      containers:
      - name: student-k8s-demo
        image: DOCKERHUB_USERNAME/student-k8s-demo:IMAGE_TAG
        ports:
        - containerPort: 5000
