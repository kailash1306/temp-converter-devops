apiVersion: apps/v1
kind: Deployment
metadata:
  name: temp-converter-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temp-converter
  template:
    metadata:
      labels:
        app: temp-converter
    spec:
      containers:
      - name: temp-converter
        image: DOCKERHUB_USERNAME/temp-converter:IMAGE_TAG
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: temp-converter-service
spec:
  type: NodePort
  selector:
    app: temp-converter
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
